<header class="shell-header">
  <div class="shell-header__content">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">C</span>
      <div>
        <span class="brand__name">Client Portal</span>
        <span class="brand__caption">Federation demo</span>
      </div>
    </div>
    <nav class="main-nav" aria-label="Main navigation">
      <a
        class="main-nav__link"
        routerLink="/"
        routerLinkActive="main-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Home</a
      >
      @for (remote of remotes; track remote.name) {
      <a
        class="main-nav__link"
        [routerLink]="'/' + remote.name"
        routerLinkActive="main-nav__link--active"
        ariaCurrentWhenActive="page"
        >{{ remote.label }}</a
      >
      }
    </nav>
    <span class="shell-header__label">Shell application</span>
  </div>
</header>

<main class="shell-content">
  <router-outlet />
</main>
